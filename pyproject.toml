[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "festyui"
version = "0.1.0"
description = "Локальная папка для временных файлов"
requires-python = ">=3.12"
dependencies = ["Send2Trash>=1.8.3,<3"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
[project.scripts]
festyui = "festyui.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
